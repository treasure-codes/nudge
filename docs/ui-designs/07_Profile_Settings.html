<div class="flex flex-col space-y-12">

<button class="flex items-center justify-between group text-left w-full active:scale-95 transition-transform duration-200">
<div class="flex flex-col">
<span class="text-xs font-bold tracking-widest uppercase text-on-surface-variant mb-1">Safety</span>
<span class="text-xl font-bold tracking-tight">Emergency Contacts</span>
</div>
<span class="material-symbols-outlined text-black group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- List Item: Alarm Sound -->
<button class="flex items-center justify-between group text-left w-full active:scale-95 transition-transform duration-200">
<div class="flex flex-col">
<span class="text-xs font-bold tracking-widest uppercase text-on-surface-variant mb-1">Audio</span>
<span class="text-xl font-bold tracking-tight">Alarm Sound</span>
</div>
<span class="material-symbols-outlined text-black group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>

</div>
<span class="material-symbols-outlined text-black group-hover:translate-x-1 transition-transform" data-icon="logout">logout</span>
