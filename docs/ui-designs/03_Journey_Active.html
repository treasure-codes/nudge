<!DOCTYPE html>

<html lang="en"><head>

<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .animate-pulse-soft {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-primary antialiased min-h-screen flex flex-col">
<!-- TopAppBar from JSON Logic -->
<header class="w-full top-0 sticky bg-white dark:bg-black flex items-center justify-between px-8 py-6 w-full z-50">
<div class="flex items-center">
<span class="material-symbols-outlined text-black dark:text-white transition-transform active:scale-95" data-icon="close">close</span>
</div>
<h1 class="font-['Inter'] font-black uppercase tracking-widest text-sm text-black dark:text-white">NUDGE</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Canvas: Journey Active -->
<main class="flex-grow flex flex-col px-8 pt-12 pb-32">
<!-- Massive Typography Section -->
<section class="flex flex-col space-y-2 mb-24">
<p class="font-['Inter'] font-bold text-[0.75rem] uppercase tracking-widest text-on-surface-variant">Arrival In</p>
<h2 class="text-[3.5rem] font-black tracking-tighter leading-none text-primary">12 mins</h2>
<div class="pt-8">
<p class="font-['Inter'] font-bold text-[0.75rem] uppercase tracking-widest text-on-surface-variant mb-1">Destination</p>
<h3 class="text-[2.0rem] font-bold tracking-tight text-primary leading-tight">Baclaran Station</h3>
</div>
</section>
<!-- Status Visualizer: Pulsing Pastel Green Circle -->
<section class="flex flex-col items-center justify-center flex-grow py-12">
<div class="relative flex items-center justify-center">
<!-- Outer Pulse Effect -->
<div class="absolute w-48 h-48 bg-secondary-container/30 rounded-full animate-pulse-soft"></div>
<!-- Inner Solid Circle -->
<div class="relative w-32 h-32 bg-secondary-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-container text-4xl" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
</div>
<div class="mt-12 text-center">
<span class="font-['Inter'] font-bold text-[0.75rem] uppercase tracking-widest text-secondary block mb-2">Monitoring Active</span>
<p class="text-on-surface-variant text-sm max-w-[200px] mx-auto leading-relaxed">We'll nudge you when you're 500m from your stop.</p>
</div>
</section>
<!-- Action Section -->
<section class="mt-auto pt-12">
<button class="w-full h-[56px] rounded-full bg-primary text-surface-container-lowest font-bold text-base flex items-center justify-center transition-transform active:scale-95">
                End Journey Early
            </button>
</section>
</main>
<!-- BottomNavBar Suppression Rule: Task-focused sub-page with back/close logic hides the shell -->
<!-- Navigation is suppressed to prioritize focus on the active journey status -->
</body></html>
