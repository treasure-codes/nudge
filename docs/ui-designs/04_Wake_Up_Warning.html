<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#dadada",
              "primary-container": "#3b3b3b",
              "on-surface-variant": "#474747",
              "tertiary-container": "#747474",
              "on-tertiary-fixed-variant": "#e2e2e2",
              "error-container": "#ffdad6",
              "outline-variant": "#c6c6c6",
              "outline": "#777777",
              "on-tertiary-container": "#ffffff",
              "primary-fixed-dim": "#474747",
              "tertiary": "#3b3b3b",
              "inverse-on-surface": "#f0f1f1",
              "surface-variant": "#e2e2e2",
              "surface-tint": "#5e5e5e",
              "on-secondary": "#ffffff",
              "on-primary-container": "#ffffff",
              "on-secondary-container": "#002107",
              "primary-fixed": "#5e5e5e",
              "tertiary-fixed-dim": "#474747",
              "surface-container-low": "#f3f3f4",
              "secondary": "#006e28",
              "on-error": "#ffffff",
              "surface-container": "#eeeeee",
              "on-tertiary": "#e2e2e2",
              "secondary-container": "#63ef7b",
              "on-primary-fixed": "#ffffff",
              "on-background": "#1a1c1c",
              "surface-container-high": "#e8e8e8",
              "on-primary": "#e2e2e2",
              "background": "#f9f9f9",
              "surface-container-highest": "#e2e2e2",
              "on-secondary-fixed-variant": "#004616",
              "secondary-fixed-dim": "#30c456",
              "inverse-primary": "#c6c6c6",
              "on-error-container": "#410002",
              "secondary-fixed": "#53e16f",
              "inverse-surface": "#2f3131",
              "surface-container-lowest": "#ffffff",
              "tertiary-fixed": "#5e5e5e",
              "surface": "#f9f9f9",
              "primary": "#000000",
              "on-primary-fixed-variant": "#e2e2e2",
              "on-tertiary-fixed": "#ffffff",
              "on-surface": "#1a1c1c",
              "on-secondary-fixed": "#002107",
              "surface-bright": "#f9f9f9",
              "error": "#ba1a1a"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .bell-animation {
            animation: ring 2s ease-in-out infinite;
        }
        @keyframes ring {
            0% { transform: rotate(0); }
            5% { transform: rotate(15deg); }
            10% { transform: rotate(-15deg); }
            15% { transform: rotate(10deg); }
            20% { transform: rotate(-10deg); }
            25% { transform: rotate(0); }
            100% { transform: rotate(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low text-on-surface font-body min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Top Navigation Anchor (Shared Component Mapping) -->
<header class="bg-white dark:bg-black text-black dark:text-white font-inter font-black tracking-tighter uppercase text-2xl docked full-width top-0 flex justify-between items-center px-6 py-8 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary dark:text-white" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="tracking-tighter font-black">EMERGENCY ALERT</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md px-10 text-center">
<!-- Massive Icon Section -->
<div class="mb-12 bell-animation">
<span class="material-symbols-outlined text-primary" style="font-size: 120px; font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<!-- Editorial Typography -->
<div class="space-y-4 mb-20">
<h1 class="text-primary font-headline font-bold text-5xl md:text-6xl tracking-tighter">
                Are you awake?
            </h1>
<p class="text-on-surface-variant font-body text-lg md:text-xl leading-relaxed max-w-[280px] mx-auto">
                Tap the button below or we will sound the alarm.
            </p>
</div>
<!-- Action Layer (The Editorial Primitives) -->
<div class="w-full flex flex-col gap-4">
<!-- Phase 1 Primary Nudge: I am awake -->
<button class="h-[56px] w-full bg-secondary-container rounded-full flex items-center justify-center transition-transform active:scale-95 duration-100 shadow-sm">
<span class="text-on-secondary-container font-headline font-bold text-lg tracking-tight">I am awake</span>
</button>
<!-- Secondary Delay Action -->
<button class="h-[56px] w-full bg-primary rounded-full flex items-center justify-center transition-transform active:scale-95 duration-100">
<span class="text-on-primary-container font-headline font-bold text-lg tracking-tight">Delay 5 mins</span>
</button>
</div>
</main>
<!-- Visual Footer Anchor (Space & Breathing Room) -->
<footer class="pb-12 pt-8 w-full flex justify-center opacity-20">
<div class="w-16 h-1.5 bg-primary rounded-full"></div>
</footer>
<!-- Image Asset Strategy (Implicit context) -->
<!-- The design focuses on high-contrast monochromatic UI elements as requested. 
         No decorative imagery used to maintain the "Emergency Alert" high-focus aesthetic. -->
</body></html>
