<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>

            font-family: 'Inter', sans-serif;

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom spacing for massive editorial look */
        .editorial-spacing {
            padding-top: 10rem;
        }
    </style>

                        "surface": "#f9f9f9",
                        "on-primary": "#e2e2e2",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9f9",

                        "secondary-fixed-dim": "#30c456",

                        "outline": "#777777",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-fixed": "#53e16f",
                        "surface-tint": "#5e5e5e",
                        "primary-container": "#3b3b3b",
                        "on-tertiary-fixed": "#ffffff",
                        "on-primary-fixed": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#e2e2e2",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "background": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "secondary-container": "#63ef7b",
                        "on-secondary": "#ffffff"

                    fontFamily: {

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Shell -->
<header class="bg-white dark:bg-black w-full pt-12 pb-4 flex items-center justify-between px-8 w-full no-border tonal-shift-bg-surface">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-black dark:text-white active:scale-95 duration-200" data-icon="close">close</button>
<h1 class="font-['Inter'] font-bold text-[2.0rem] tracking-tight text-black dark:text-white">Alert</h1>
</div>
</header>
<!-- Main Editorial Content Canvas -->
<main class="flex-grow px-8 pt-16 flex flex-col items-start max-w-lg mx-auto w-full">
<!-- Status Indicator -->
<div class="mb-12 flex items-center gap-3">
<div class="w-3 h-3 bg-error rounded-full animate-pulse"></div>
<span class="font-['Inter'] text-[0.75rem] font-bold uppercase tracking-widest text-on-surface-variant">Live Broadcast Active</span>
</div>
<!-- Headline -->
<h2 class="text-[3.5rem] font-black leading-[1.1] tracking-tighter text-primary mb-8">
            You missed your stop.
        </h2>
<!-- Subheading -->
<p class="text-[1.125rem] leading-relaxed text-on-surface-variant font-medium mb-16">
            Your emergency contact (Ate Rosa) has been notified of your location.
        </p>
<!-- Location Context Section -->
<section class="w-full mb-20">
<div class="flex flex-col gap-2">
<span class="text-[0.75rem] font-bold uppercase tracking-widest text-on-surface-variant">Current Location</span>
<div class="flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-1" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<p class="text-[1.25rem] font-bold text-primary leading-snug">
                        123 Taft Ave, Manila
                    </p>
</div>
</div>
<!-- Minimal Map Representation (Tonal Nesting) -->
<div class="mt-8 h-48 w-full bg-surface-container rounded-lg overflow-hidden relative">
<img class="w-full h-full object-cover grayscale opacity-60" data-alt="A clean minimalist map interface showing a street grid of Manila with a single black pulse pin on a white background" data-location="Manila" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC09txA0gcW30ZXHmo01TyGs6f6iaREcXORBuKgAdomh8YgYxV2sDOI4QPnGaPVJKGKt6VkstmL6URJJhPe4exPRBa1eh1CLNCV9Sp0UHkHRRDYVrs8j6N0m32B3Gha-8mWIqsBo405U26QYq6acR0HYwHHqBbdgAr6yhGUqOlTDJW9z9y_82hBRb6234dGEoO2MTHEnDy5wHEDz47X43aRXRVlBpLHyU8Yfd2XGtBhkm4bk3kX9NkSGKO-vcfxt3nWW7_ufOVMFw4B"/>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-8 h-8 bg-primary rounded-full border-4 border-white shadow-lg"></div>
</div>
</div></section>
<!-- CTA Section -->
<div class="w-full mt-auto pb-12">
<button class="w-full h-[56px] bg-primary text-white rounded-full font-bold text-[1rem] active:scale-95 transition-all flex items-center justify-center gap-2 hover:bg-zinc-800">
<span class="material-symbols-outlined text-white" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                I am safe. Stop broadcasting.
            </button>
<p class="text-center mt-6 text-[0.875rem] text-on-surface-variant font-medium">
                Broadcast will end automatically in 15 minutes.
            </p>
</div>
</main>
<!-- BottomNavBar Shell (Suppressed based on Task-Focused rule, but if requested by context would be here) -->
<!-- Exclusion rule applied: Task-Focused journey (Alert/Security) implies temporary departure from global nav -->
</body></html>
