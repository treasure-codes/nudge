<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-container": "#ffffff",
              "primary-fixed": "#5e5e5e",
              "tertiary": "#3b3b3b",
              "surface": "#f9f9f9",
              "on-error-container": "#410002",
              "surface-bright": "#f9f9f9",
              "outline": "#777777",
              "primary": "#000000",
              "on-background": "#1a1c1c",
              "outline-variant": "#c6c6c6",
              "tertiary-container": "#747474",
              "surface-tint": "#5e5e5e",
              "on-secondary-fixed-variant": "#004616",
              "on-secondary-container": "#002107",
              "tertiary-fixed": "#5e5e5e",
              "secondary-fixed-dim": "#30c456",
              "primary-fixed-dim": "#474747",
              "surface-container-high": "#e8e8e8",
              "on-error": "#ffffff",
              "on-primary-container": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#474747",
              "on-primary": "#e2e2e2",
              "on-primary-fixed": "#ffffff",
              "surface-container-highest": "#e2e2e2",
              "on-tertiary-fixed-variant": "#e2e2e2",
              "secondary": "#006e28",
              "background": "#f9f9f9",
              "inverse-surface": "#2f3131",
              "on-tertiary-fixed": "#ffffff",
              "secondary-fixed": "#53e16f",
              "surface-container-low": "#f3f3f4",
              "on-secondary-fixed": "#002107",
              "on-tertiary": "#e2e2e2",
              "on-surface": "#1a1c1c",
              "on-primary-fixed-variant": "#e2e2e2",
              "tertiary-fixed-dim": "#474747",
              "on-secondary": "#ffffff",
              "surface-container": "#eeeeee",
              "inverse-on-surface": "#f0f1f1",
              "primary-container": "#3b3b3b",
              "error": "#ba1a1a",
              "secondary-container": "#63ef7b",
              "surface-dim": "#dadada",
              "error-container": "#ffdad6",
              "inverse-primary": "#c6c6c6"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-ring {
            0% { transform: scale(.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(.8); opacity: 0.5; }
        }
        .pulsate-layer {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface font-body selection:bg-secondary-container antialiased">
<!-- TopAppBar Fragment - Suppressed Navigation Shell for focused task as per mandate -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-8 h-20 bg-white/80 backdrop-blur-xl">
<span class="font-['Inter'] font-black tracking-tighter uppercase text-sm text-black">NUDGE</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-black" data-icon="notifications_active">notifications_active</span>
</div>
</header>
<main class="min-h-screen flex flex-col items-center justify-between px-8 pt-40 pb-24 text-center">
<!-- Massive Editorial Headline -->
<section class="w-full">
<h1 class="text-[3.5rem] font-black leading-[0.9] tracking-tighter text-black uppercase mb-2">
                WAKE UP!
            </h1>
<p class="text-label-md font-bold uppercase tracking-widest text-on-surface-variant">
                ALARM ACTIVE
            </p>
</section>
<!-- Pulsating Hero Icon -->
<section class="relative flex items-center justify-center py-12">
<!-- Pulsating Backdrop -->
<div class="absolute w-64 h-64 bg-primary rounded-full pulsate-layer"></div>
<div class="absolute w-48 h-48 bg-primary/10 rounded-full animate-ping"></div>
<!-- Core Icon -->
<div class="relative w-40 h-40 bg-primary rounded-full flex items-center justify-center z-10">
<span class="material-symbols-outlined text-white text-7xl" data-icon="alarm" style="font-variation-settings: 'FILL' 1;">alarm</span>
</div>
</section>
<!-- Urgency Text & Action Area -->
<section class="w-full space-y-12">
<div class="space-y-4 max-w-xs mx-auto">
<p class="text-error font-bold leading-tight">
                    You have arrived. Audio is playing at maximum volume.
                </p>
</div>
<div class="flex flex-col items-center gap-8">
<!-- Primary CTA -->
<button class="w-full max-w-sm h-14 bg-primary text-white rounded-full font-bold uppercase tracking-widest text-xs flex items-center justify-center active:scale-95 transition-transform duration-200">
                    Turn Off Alarm
                </button>
<!-- Secondary Link -->
<a class="text-on-surface-variant font-medium text-sm hover:text-black transition-colors underline decoration-outline-variant underline-offset-8" href="#">
                    Call Emergency Contact
                </a>
</div>
</section>
</main>
<!-- Bottom Navigation Suppressed for Task-Focused "Dead End" relative to global nav -->
<!-- Decorative Texture Layer -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20">
<div class="absolute top-0 right-0 w-96 h-96 bg-secondary-container rounded-full blur-[120px] -mr-48 -mt-48"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 bg-surface-container-high rounded-full blur-[80px] -ml-32 -mb-32"></div>
</div>
</body></html>
